name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (money, validation, files, translation completeness)
        run: pnpm test

  database-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (migrations + seed)
        run: supabase start -x studio,logflare,vector,realtime,imgproxy
      - name: RLS and business-rule tests (pgTAP)
        run: supabase test db
      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.ts
          diff -q /tmp/database.ts packages/types/src/database.ts || (echo "Run: pnpm db:types" && exit 1)
      - name: Build and start the app
        run: |
          eval "$(supabase status -o env)"
          cat > apps/web/.env.local <<ENV
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          ENV
          pnpm build
          (cd apps/web && nohup pnpm start -p 3000 > /tmp/next.log 2>&1 &)
          npx wait-on -t 60000 http://localhost:3000/login
      - name: End-to-end tests
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            apps/web/e2e/.results
            /tmp/next.log
          retention-days: 7
